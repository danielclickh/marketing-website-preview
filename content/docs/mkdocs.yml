site_name: 'ClickHouse Documentation'
site_url: https://clickhouse.com/docs/
docs_dir: !ENV [LANGUAGE, 'en']
repo_url: https://github.com/ClickHouse/ClickHouse

theme: 
  name: material
  favicon: https://clickhouse.com/favicon.ico
  logo: https://clickhouse.com/images/logo.svg
  icon:
    alternate: fontawesome/solid/language  
  palette:
    primary: black
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
  font:
    text: Hind Siliguri
    code: IBM Plex Mono

# Extensions
markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: _includes
  - admonition
  - meta
  - def_list
  - attr_list
  - pymdownx.saneheaders
  - tables
  - footnotes
  - markdown_include.include:
      base_path: _includes

plugins:
  - macros
  - search:
      separator: '[\s\-\.]+'
  - material-relative-language-selector:
      root_domain: true
      

copyright: Copyright &copy; 2016-2022 ClickHouse, Inc.

