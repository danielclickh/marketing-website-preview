<ng-container *ngIf="themeObs | async as theme">
  <div *ngIf="contactUsDataPromise | async as contactUsData" class="contact_us">
    <div *ngIf="contactUsData.hero as hero" class="hero">
      <div class="container">
        <div class="section_metadata">
          <div class="title">{{hero.title}}</div>
          <div class="description">{{hero.description}}</div>
        </div>
        <contact-form [contactForm]="hero.contactForm" class="contact_form"></contact-form>
      </div>
    </div>

    <growing-community></growing-community>
    <getting-started></getting-started>
  </div>
</ng-container>
