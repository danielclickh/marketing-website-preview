<ng-container *ngIf="themeObs | async as theme">
  <div *ngIf="cloudDataPromise | async as cloudData" class="cloud">
    <div *ngIf="cloudData.hero as hero" class="hero">
      <div class="background_overlay"></div>
      <div class="background_image_wrapper">
        <mat-icon [svgIcon]="hero.backgroundSvgId" class="background_image"></mat-icon>
      </div>
      <div class="container">
        <div class="left">
          <div [innerHTML]="hero.title" class="title"></div>
          <div class="description">{{hero.description}}</div>
          <a *ngIf="hero.ctaButton as ctaButton"
             [href]=ctaButton.href
             [target]="ctaButton.target"
             class="cta_button">
            <button class="primary_button">{{ctaButton.text}}</button>
          </a>

          <div class="cloud_providers">
            <div *ngFor="let cloudProvider of hero.cloudProviders" class="cloud_provider">
              <div class="cloud_provider_title">{{cloudProvider.title}}</div>
              <div class="logos">
                <img
                  *ngFor="let logo of theme === 'dark' ? cloudProvider.darkProviderPngUrls : cloudProvider.lightProviderPngUrls"
                  [src]="logo | strapiImageUrl"
                  class="logo"
                  alt="logo"
                />
              </div>
            </div>
          </div>
        </div>
        <div class="right">
          <img [src]="hero.videoGifUrl | strapiImageUrl" alt="video" class="video_gif"/>
        </div>
      </div>
    </div>
    <div class="features">
      <div class="container">
        <feature-list [features]="cloudData.features"></feature-list>
      </div>
    </div>

    <div class="screenshot_and_bullets">
      <div class="container">
        <screenshot-and-bullets-list
          [screenshotAndBulletsList]="cloudData.screenshotsAndBullets"></screenshot-and-bullets-list>
      </div>
    </div>


    <div *ngIf="cloudData.earlyAccessForm as earlyAccessForm" class="early_access_form">
      <div class="container">
        <div class="section_metadata">
          <div class="pretitle">{{earlyAccessForm.pretitle}}</div>
          <div class="section_title">{{earlyAccessForm.title}}</div>
          <div class="section_description">{{earlyAccessForm.description}}</div>
        </div>

        <form (ngSubmit)="onSubmit().then()" [formGroup]="form" class="form">
          <div class="first_and_last_name_inputs">
            <div class="seed_form_element">
              <label class="seed_label">{{earlyAccessForm.firstNameLabel}}</label>
              <input class="seed_input" formControlName="firstName" name="firstName" type="text">
              <div *ngIf="!form.controls['firstName'].valid && form.controls['firstName'].touched" class="seed_error">
                Invalid first name
              </div>
            </div>

            <div class="seed_form_element">
              <label class="seed_label">{{earlyAccessForm.lastNameLabel}}</label>
              <input class="seed_input" formControlName="lastName" name="lastName" type="text">
              <div *ngIf="!form.controls['lastName'].valid && form.controls['lastName'].touched" class="seed_error">
                Invalid last name
              </div>
            </div>
          </div>

          <div class="seed_form_element">
            <label class="seed_label">{{earlyAccessForm.emailLabel}}</label>
            <input class="seed_input" formControlName="email" name="email" type="email">
            <div *ngIf="!form.controls['email'].valid && form.controls['email'].touched" class="seed_error">
              Invalid e-mail address
            </div>
          </div>

          <div class="seed_form_element">
            <label class="seed_label">{{earlyAccessForm.companyLabel}} <span class="optional">(Optional)</span></label>
            <input class="seed_input" formControlName="company" name="company" type="text">
          </div>

          <div class="seed_form_element textarea_container">
            <label class="seed_label">{{earlyAccessForm.useCaseLabel}} <span class="optional">(Optional)</span></label>
            <textarea class="seed_input textarea" formControlName="useCase" name="useCase"></textarea>
          </div>

          <div class="bottom">
            <button [disabled]="serverCallInProgress"
                    class="submit_button primary_button">{{earlyAccessForm.submitButton.text}}</button>
            <div class="disclaimer">{{earlyAccessForm.disclaimer}}</div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <getting-started class="getting_started_section"></getting-started>
</ng-container>
