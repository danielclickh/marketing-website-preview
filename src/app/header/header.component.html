<div *ngIf="headerDataPromise | async as headerData" class="header">
  <div class="container">
    <a class="logo_container" routerLink="/">
      <mat-icon [svgIcon]="headerData.logoIconId" class="icon"></mat-icon>
      <div class="text">ClickHouse</div>
    </a>

    <div class="nav_container">
      <div *ngFor="let topMenuItem of headerData.menuItems; trackBy: trackById" class="top_level_menu_item_container">
        <a *ngIf="!topMenuItem.menuItems.length"
           [href]="topMenuItem.href"
           [target]="topMenuItem.target"
           class="top_level_item_without_submenu">
          {{topMenuItem.name}}
        </a>
        <div
          *ngIf="topMenuItem.menuItems.length"
          [matMenuTriggerFor]="subMenu" class="top_level_item_with_submenu">
          {{topMenuItem.name}}
          <mat-icon class="menu_arrow" svgIcon="menu_arrow"></mat-icon>

        </div>
        <mat-menu #subMenu="matMenu" xPosition="after">
          <div *ngIf="isMenuWithIcons(topMenuItem)" class="sub_menu menu_with_icons">
            <a *ngFor="let subMenuItem of topMenuItem.menuItems"
               [href]="subMenuItem.href"
               [target]="subMenuItem.target"
               class="sub_menu_item menu_with_icon_item">
              <div class="icon_wrapper">
                <mat-icon [svgIcon]="subMenuItem.iconId!" class="icon"></mat-icon>
              </div>

              <div class="menu_data">
                <div class="name">{{subMenuItem.name}}</div>
                <div class="description">{{subMenuItem.description}}</div>
              </div>
            </a>

          </div>

          <div *ngIf="!isMenuWithIcons(topMenuItem)" class="sub_menu menu_with_item_list">
            <a
              *ngFor="let subMenuItem of topMenuItem.menuItems"
              [href]="subMenuItem.href"
              [target]="subMenuItem.target"
              class="sub_menu_item">
              {{subMenuItem.name}}
            </a>
          </div>
        </mat-menu>
      </div>
    </div>

    <div *ngIf="themeObs | async as theme" class="buttons_container">
      <mat-icon (click)="switchTheme('light');" [ngClass]="{active: theme === 'light'}" class="sun"
                svgIcon="sun"></mat-icon>
      <mat-icon (click)="switchTheme('dark')" [ngClass]="{active: theme === 'dark'}" class="moon"
                svgIcon="moon"></mat-icon>
      <a *ngIf="headerData.ctaButton as ctaButton"
         [href]=ctaButton.href
         [target]="ctaButton.target"
         class="cta_button">
        <button class="button" mat-flat-button>{{ctaButton.text}}</button>
      </a>
    </div>
  </div>
</div>
