<script>

  try {
    var theme = localStorage.getItem('ch_theme');
    if (!theme) {
      theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.body.classList.remove('light', 'dark');
    document.body.classList.add(theme);
  } catch (e) {
    console.error(e);
  }
</script>
